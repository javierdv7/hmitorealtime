; Edge Rules — ESP32-C3 firmware
;
; Two environments because ESP32-C3 boards wire USB-C in two ways:
;   c3_usbcdc : USB-C goes straight to the C3 (SuperMini, most cheap boards)  <- default
;   c3_uart   : USB-C goes to a USB-UART bridge chip (CH340/CP2102, e.g. DevKitM-1)
; If you see no serial output after flashing, try the other one.

[platformio]
default_envs = c3_usbcdc

[env]
platform = espressif32@6.9.0
; esptool 4.5 (bundled) fails on macOS with native USB-JTAG -> use 4.8.1
platform_packages = platformio/tool-esptoolpy@~1.40801.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200   ; native USB-JTAG ignores baud; changing it breaks esptool on macOS
monitor_filters = esp32_exception_decoder, time
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -DMQTT_MAX_PACKET_SIZE=3400
  -DCORE_DEBUG_LEVEL=0

[env:c3_usbcdc]
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:c3_uart]
build_flags =
  ${env.build_flags}
